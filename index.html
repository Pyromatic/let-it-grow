<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Let It Grow</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredericka+the+Great&family=Caveat:wght@500;700&family=Bitter:wght@400;600&display=swap">
<style>
/* Layout: dark plank floor. Home is a shelf of small carved albums; opening one shows a carved board whose first page is the cover (one big taped 16:9 photo under the title), then pages of four taped 16:9 prints. Vines grow around every board. Single committed look. */
:root{
  --plank:#3b2417;
  --board:#8a5a36;
  --board-edge:#5a3720;
  --paper:#f6efe1;
  --ink:#2b1a10;
  --cream:#f3e6cc;
  --muted:#d9c39b;
  --leaf:#4f7a2e;
  --brass:#c9a04a;
  --pumpkin:#d8772a;
  --f-display:"Fredericka the Great","Rockwell",Georgia,serif;
  --f-hand:"Caveat","Segoe Print","Comic Sans MS",cursive;
  --f-ui:"Bitter",Georgia,"Times New Roman",serif;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;background:var(--plank);color:var(--cream)}
img,video{max-width:100%}
[hidden]{display:none!important}
body{
  font-family:var(--f-ui);font-size:15px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:calc(26px + env(safe-area-inset-top,0px)) calc(48px + env(safe-area-inset-bottom,0px));
  background-color:var(--plank);background-size:900px auto;min-height:100%;
}
.wrap{max-width:1040px;margin:0 auto;display:flex;flex-direction:column;gap:22px}

/* buttons */
.btn{font-family:var(--f-ui);font-weight:600;font-size:14px;letter-spacing:.04em;color:var(--ink);
  background:linear-gradient(#e7c97f,var(--brass));border:1px solid #7a5a1d;border-radius:6px;padding:9px 16px;cursor:pointer;
  box-shadow:0 2px 0 #6b4a14,0 4px 10px rgba(0,0,0,.35);text-decoration:none;display:inline-flex;align-items:center;gap:6px}
.btn:hover{filter:brightness(1.07)}
.btn:active{transform:translateY(1px);box-shadow:0 1px 0 #6b4a14}
.btn:disabled{opacity:.45;cursor:default;filter:none}
.btn.ghost{background:rgba(0,0,0,.25);color:var(--cream);border-color:#a07a4a;box-shadow:none}
.btn.danger{background:rgba(0,0,0,.25);color:#f0b9a0;border-color:#8a4a32;box-shadow:none}
.btn.danger.armed{background:#8a3a22;color:#fff}
:focus-visible{outline:3px solid #f2d27a;outline-offset:3px}

/* ---------- home: collections shelf ---------- */
.site-head{text-align:center;display:flex;flex-direction:column;gap:4px;padding-block:6px 10px}
.site-head h1{margin:0;font-family:var(--f-display);font-weight:400;font-size:clamp(40px,7vw,72px);line-height:1.05;color:var(--cream);
  text-shadow:0 2px 0 rgba(0,0,0,.5);text-wrap:balance}
.eyebrow{font-weight:600;font-size:13px;letter-spacing:.32em;text-transform:uppercase;color:var(--pumpkin)}
.shelf{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:34px 28px}
.book{position:relative;display:flex;flex-direction:column;gap:12px;text-decoration:none;color:inherit;min-width:0}
.book-board{position:relative;border-radius:10px;background-color:var(--board);background-size:420px auto;
  box-shadow:inset 0 0 0 5px var(--board-edge),inset 0 0 26px rgba(30,15,5,.55),0 12px 26px rgba(0,0,0,.55);
  padding:30px 26px 24px;transition:transform .25s ease;display:flex;flex-direction:column;gap:14px;align-items:center}
.book:hover .book-board{transform:translateY(-4px) rotate(-.4deg)}
.book-board canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:3}
.book-photo{position:relative;width:100%;background:var(--paper);padding:7px;transform:rotate(-.8deg);
  box-shadow:0 6px 14px rgba(25,10,0,.45);z-index:2}
.book-photo .ph{aspect-ratio:16/9}
.book-title{position:relative;z-index:4;font-family:var(--f-display);font-size:26px;line-height:1.15;text-align:center;color:var(--t-ink,#2a160b);
  text-shadow:0 1px 0 var(--t-glow,rgba(255,215,160,.35));text-wrap:balance;overflow-wrap:anywhere}
.book-sub{position:relative;z-index:4;margin-top:-10px;font-weight:600;font-size:11px;letter-spacing:.28em;text-transform:uppercase;color:var(--t-sub,var(--pumpkin));text-shadow:0 1px 0 var(--t-subsh,rgba(0,0,0,.55));text-align:center}
.book-count{text-align:center;font-family:var(--f-hand);font-size:22px;color:var(--muted)}
.book.new .book-board{background:rgba(0,0,0,.22);box-shadow:none;border:2px dashed #8f6a42;min-height:100%;justify-content:center;gap:10px}
.book.new h2{margin:0;font-family:var(--f-display);font-weight:400;font-size:26px;color:var(--cream)}
.field{width:100%;display:flex;flex-direction:column;gap:4px}
.field label{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.field input{width:100%;font:inherit;font-size:16px;color:var(--ink);background:var(--paper);border:1px solid #a07a4a;border-radius:5px;padding:9px 10px}
.home-note{text-align:center;color:var(--muted);font-size:13px;margin:0}
.loading{text-align:center;font-family:var(--f-hand);font-size:26px;color:var(--muted);padding:40px 0}

/* ---------- album ---------- */
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.btns{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.hint{font-size:13px;color:var(--muted)}

.board{position:relative;border-radius:14px;background-color:var(--board);background-size:700px auto;
  box-shadow:inset 0 0 0 6px var(--board-edge),inset 0 0 40px rgba(30,15,5,.55),0 18px 40px rgba(0,0,0,.55);
  padding:clamp(54px,8vw,84px) clamp(28px,6vw,72px) clamp(64px,8vw,96px)}
.board::after{content:"";position:absolute;inset:18px;border-radius:8px;pointer-events:none;
  box-shadow:inset 0 2px 3px rgba(0,0,0,.45),0 1px 0 rgba(255,220,170,.18)}
.board.drag{box-shadow:inset 0 0 0 6px var(--brass),inset 0 0 40px rgba(30,15,5,.55),0 18px 40px rgba(0,0,0,.55)}
#vines{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:3}

.title{position:relative;z-index:4;text-align:center;margin:0 auto 34px;max-width:22ch;
  font-family:var(--f-display);font-weight:400;font-size:clamp(30px,5.4vw,56px);line-height:1.1;color:var(--t-ink,#2a160b);text-wrap:balance;
  text-shadow:0 1px 0 var(--t-glow,rgba(255,215,160,.35)),0 -1px 0 rgba(0,0,0,.35);overflow-wrap:anywhere}
.title.small{font-size:clamp(22px,3.4vw,32px);margin-bottom:26px}
.title .t,.title .yr{outline:none;border-radius:4px}
.title [contenteditable="true"]:hover,.title [contenteditable="true"]:focus{background:rgba(255,230,190,.14)}
.yr{display:block;margin-top:8px;font-family:var(--f-ui);font-weight:600;font-size:clamp(13px,1.6vw,16px);letter-spacing:.32em;text-transform:uppercase;color:var(--t-sub,var(--pumpkin));text-shadow:0 1px 0 var(--t-subsh,rgba(0,0,0,.45));min-height:1.2em}
.title.small .yr{font-size:12px;margin-top:4px}
.folio{position:absolute;z-index:4;left:0;right:0;bottom:clamp(30px,4vw,44px);text-align:center;font-family:var(--f-hand);font-weight:700;font-size:22px;color:var(--t-folio,#3a2212)}

.grid{position:relative;z-index:2;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:46px 40px;padding-top:8px}
@media (max-width:560px){.grid{grid-template-columns:minmax(0,1fr);gap:34px}}
.turn{animation:turn .35s ease}
@keyframes turn{from{opacity:0;transform:translateX(var(--dx,20px))}to{opacity:1;transform:none}}

.slot{position:relative;background:var(--paper);padding:9px;border-radius:1px;margin:0;
  box-shadow:0 1px 1px rgba(0,0,0,.2),0 8px 18px rgba(25,10,0,.45);
  transform:rotate(var(--r,0deg));transition:transform .25s ease;cursor:pointer;min-width:0}
.slot:hover{transform:rotate(0deg) scale(1.02);z-index:5}
.tape{position:absolute;top:-13px;left:50%;width:min(34%,130px);height:28px;z-index:2;pointer-events:none;
  transform:translateX(-50%) rotate(var(--t,-3deg));
  background:linear-gradient(rgba(255,255,255,.18),rgba(255,255,255,0) 40%,rgba(0,0,0,.04)),var(--t-tape,rgba(232,219,182,.78));
  box-shadow:0 1px 2px rgba(40,20,5,.25);
  clip-path:polygon(0 4%,4% 0,8% 6%,12% 0,88% 0,92% 6%,96% 0,100% 5%,100% 95%,96% 100%,92% 94%,88% 100%,12% 100%,8% 94%,4% 100%,0 96%,3% 50%)}
.tape.l{left:12%;transform:translateX(-50%) rotate(-38deg);top:-6px;width:min(22%,120px)}
.tape.r{left:88%;transform:translateX(-50%) rotate(36deg);top:-6px;width:min(22%,120px)}
.ph{position:relative;aspect-ratio:16/9;max-width:100%;background:#d8cdb8;overflow:hidden;display:grid;place-items:center}
.ph img,.ph video{width:100%;height:100%;object-fit:cover;display:block}
.badge{position:absolute;left:8px;bottom:8px;z-index:2;font-size:11px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;
  background:rgba(20,10,4,.72);color:var(--cream);border-radius:4px;padding:3px 7px;pointer-events:none}
.playmark{position:absolute;inset:0;margin:auto;width:54px;height:54px;border-radius:50%;background:rgba(20,10,4,.6);pointer-events:none;z-index:2}
.playmark::after{content:"";position:absolute;left:21px;top:16px;border-style:solid;border-width:11px 0 11px 18px;border-color:transparent transparent transparent var(--cream)}
.empty{width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;
  border:2px dashed #a89878;color:#6d5d43;font-size:13px;text-align:center;padding:10px;
  background:repeating-linear-gradient(45deg,#e4d9c3 0 10px,#ddd1b9 10px 20px)}
.empty b{font-family:var(--f-hand);font-size:26px;color:var(--leaf);line-height:1}
.x{position:absolute;top:4px;right:4px;width:30px;height:30px;border-radius:50%;border:0;cursor:pointer;
  background:rgba(43,26,16,.78);color:var(--cream);font-size:17px;line-height:30px;opacity:0;transition:opacity .2s;z-index:3}
.slot:hover .x,.slot:focus-within .x{opacity:1}
@media (hover:none){.x{opacity:.85}}

.hero{position:relative;z-index:2;max-width:820px;margin:6px auto 0;--r:-.6deg;padding:12px}
.hero-actions{position:relative;z-index:4;display:flex;justify-content:center;margin-top:30px}
.hero-actions .btn.ghost{background:rgba(30,20,12,.8);border-color:rgba(30,20,12,.8)}

.themes{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;background:rgba(0,0,0,.3);border:1px solid #6f5034;border-radius:10px;padding:14px}
.themes h2{grid-column:1/-1;margin:0;font-family:var(--f-display);font-weight:400;font-size:22px;color:var(--cream)}
.tsw{display:flex;flex-direction:column;gap:6px;background:none;border:2px solid transparent;border-radius:9px;padding:6px;cursor:pointer;color:var(--cream);font:inherit;font-size:14px;font-weight:600;text-align:center}
.tsw img{width:100%;aspect-ratio:16/10;border-radius:5px;display:block;box-shadow:0 4px 10px rgba(0,0,0,.45);transition:transform .2s}
.tsw:hover img{transform:translateY(-2px)}
.tsw[aria-pressed="true"]{border-color:var(--brass);background:rgba(201,160,74,.12)}
.tchips{display:flex;flex-wrap:wrap;gap:6px}
.tchip{position:relative}
.tchip input{position:absolute;opacity:0;width:1px;height:1px}
.tchip span{display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border:1px solid #a07a4a;border-radius:999px;font-size:13px;cursor:pointer;color:var(--cream);background:rgba(0,0,0,.2)}
.tchip i{width:12px;height:12px;border-radius:50%;display:inline-block;box-shadow:inset 0 0 0 2px rgba(0,0,0,.25)}
.tchip input:checked+span{background:var(--brass);color:#2b1a10;border-color:var(--brass)}
.tchip input:focus-visible+span{outline:3px solid #f2d27a;outline-offset:2px}
.flabel{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.pager{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between}
.turnbtns{display:flex;gap:10px;align-items:center}
.pnum{font-family:var(--f-hand);font-size:24px;font-weight:700;color:var(--cream);min-width:7ch;text-align:center;font-variant-numeric:tabular-nums}

/* lightbox */
.lb{position:fixed;inset:0;z-index:50;background:rgba(15,8,3,.9);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;
  padding:calc(20px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.lb img,.lb video{max-width:100%;max-height:78vh;border:10px solid var(--paper);box-shadow:0 20px 50px rgba(0,0,0,.6);background:#000}
.lb .row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}

.toast{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:60;
  background:var(--ink);color:var(--cream);border:1px solid #a07a4a;padding:9px 16px;border-radius:6px;font-size:14px;max-width:calc(100% - 32px);text-align:center}
@media (prefers-reduced-motion:reduce){.slot,.x,.book-board,.tsw img{transition:none}.turn{animation:none}}
</style>
</head>
<body>

<!-- HOME: collections -->
<div class="wrap" id="home">
  <header class="site-head">
    <span class="eyebrow">Collections</span>
    <h1>Let It Grow</h1>
  </header>
  <div class="loading" id="homeLoading">Gathering the albums…</div>
  <div class="shelf" id="shelf" hidden></div>
  <p class="home-note">Anyone with this link can add photos, GIFs and videos to any collection.</p>
</div>

<!-- ALBUM -->
<div class="wrap" id="album" hidden>
  <div class="bar">
    <div class="btns">
      <a class="btn ghost" href="#" id="backBtn">◀ All collections</a>
      <button class="btn" id="addBtn" type="button">Add photos &amp; videos</button>
      <button class="btn ghost" id="pageBtn" type="button">Add a page</button>
      <button class="btn ghost" id="themeBtn" type="button" aria-expanded="false" aria-controls="themePanel">Theme: <span id="themeName">Overgrown</span></button>
    </div>
    <span class="hint">Four to a page. GIFs up to 8 MB. Big videos get shrunk before uploading.</span>
  </div>

  <div class="themes" id="themePanel" hidden></div>

  <section class="board" id="board">
    <canvas id="vines" aria-hidden="true"></canvas>
    <div id="pageBody"></div>
    <div class="folio" id="folio"></div>
  </section>

  <div class="pager">
    <div class="turnbtns">
      <button class="btn ghost" id="prev" type="button" aria-label="Previous page">◀ Back</button>
      <span class="pnum" id="pnum">Cover</span>
      <button class="btn ghost" id="next" type="button" aria-label="Next page">Next ▶</button>
    </div>
    <div class="btns">
      <button class="btn danger" id="delColl" type="button" hidden>Delete collection</button>
      <button class="btn" id="dlBtn" type="button">Download this page as a photo</button>
    </div>
  </div>
</div>

<input type="file" id="file" accept="image/*,video/*,.gif,.mov,.mp4,.webm" multiple hidden>
<input type="file" id="coverFile" accept="image/*" hidden>
<div class="lb" id="lb" hidden>
  <img id="lbImg" alt="Album photo" hidden>
  <video id="lbVid" controls playsinline hidden></video>
  <div class="row"><button class="btn ghost" id="lbPrev" type="button">Previous</button><button class="btn" id="lbClose" type="button">Close</button><button class="btn ghost" id="lbNext" type="button">Next</button></div>
</div>
<div class="toast" id="toast" role="status" hidden></div>

function T(id){return THEMES[id]||THEMES.grove}
function themeId(id){return THEMES[id]?id:'grove'}

function wood(w,h,plankH,base,seed){
  var R=rng(seed),c=document.createElement('canvas');c.width=w;c.height=h;var x=c.getContext('2d');
  var dk=base.map(function(v){return Math.round(v*.28)}).join(','),hi=base.map(function(v){return Math.min(255,v+105)}).join(','),dd=base.map(function(v){return Math.round(v*.12)}).join(',');
  for(var py=0;py<h;py+=plankH){
    var shade=(R()-.5)*22;
    x.fillStyle='rgb('+(base[0]+shade)+','+(base[1]+shade*.7)+','+(base[2]+shade*.5)+')';
    x.fillRect(0,py,w,plankH);
    for(var i=0;i<plankH*1.4;i++){
      var y0=py+R()*plankH,amp=1+R()*4,freq=.002+R()*.01,ph=R()*6;
      x.beginPath();x.lineWidth=.5+R()*1.4;
      var dark=R()<.6;x.strokeStyle=dark?'rgba('+dk+','+(.1+R()*.22)+')':'rgba('+hi+','+(.04+R()*.08)+')';
      for(var xx=0;xx<=w;xx+=8){var yy=y0+Math.sin(xx*freq+ph)*amp+Math.sin(xx*freq*3.1)*amp*.3;xx?x.lineTo(xx,yy):x.moveTo(xx,yy)}
      x.stroke();
    }
    if(R()<.7){var kx=R()*w,ky=py+plankH*(.3+R()*.4),kr=6+R()*12;
      for(var k=0;k<7;k++){x.beginPath();x.ellipse(kx,ky,kr*(1+k*.6)*2.2,kr*(1+k*.35)*.6,0,0,Math.PI*2);x.strokeStyle='rgba('+dk+','+(.38-k*.04)+')';x.lineWidth=1.2;x.stroke()}
      x.beginPath();x.ellipse(kx,ky,kr*1.6,kr*.45,0,0,Math.PI*2);x.fillStyle='rgba('+dk+',.6)';x.fill()}
    x.fillStyle='rgba('+dd+',.75)';x.fillRect(0,py,w,2);
    x.fillStyle='rgba('+hi+',.08)';x.fillRect(0,py+2,w,1);
  }
  return c;
}
var woodCache={};

  for(var i=0;i<140;i++){var y=R()*h;x.fillStyle=R()<.5?'rgba(0,0,0,'+(.012+R()*.02)+')':'rgba(255,255,255,'+(.015+R()*.025)+')';x.fillRect(0,y,w,1+R()*2)}
  return c}

  if(!woodCache[key]){var t=T(id),c=kind==='plank'?wood(900,900,150,t.plank,7):(t.plain?painted(700,700,t.board,21):wood(700,700,700/3,t.board,21));woodCache[key]={canvas:c,url:c.toDataURL('image/jpeg',.85)}}

/* ---------- decorations: stems, leaves, blooms, extras ---------- */
var cv=document.getElementById('vines'),board=document.getElementById('board');

    x.strokeStyle=col[1];x.lineWidth=Math.max(.7,s*.07);x.beginPath();x.moveTo(0,0);x.lineTo(s*1.1,0);x.stroke();
    x.strokeStyle=col[0];x.lineWidth=Math.max(.5,s*.05);x.beginPath();

function tendril(x,cx,cy,ang,s,dir,col){

}

    if(R()<.6){x.fillStyle='#3a1500';[-1,1].forEach(function(d){x.beginPath();x.moveTo(d*s*.36,-s*.08);x.lineTo(d*s*.14,-s*.08);x.lineTo(d*s*.25,-s*.3);x.closePath();x.fill()});

function web(x,cx,cy,a0,r,k){
  x.save();x.strokeStyle='rgba(235,230,245,.5)';x.lineWidth=.9*k;var n=6,i,j,a;

    for(i=0;i<=n;i++){a=a0+i/n*Math.PI/2;var px=cx+Math.cos(a)*rr,py=cy+Math.sin(a)*rr;
      if(!i)x.moveTo(px,py);else{var am=a0+(i-.5)/n*Math.PI/2;x.quadraticCurveTo(cx+Math.cos(am)*rr*.86,cy+Math.sin(am)*rr*.86,px,py)}}
    x.stroke()}
  x.restore();

  for(var i=0;i<4;i++){[-1,1].forEach(function(d){x.beginPath();x.moveTo(0,2*k);x.quadraticCurveTo(d*7*k,(-3+i*3)*k,d*10*k,(1+i*3.5)*k);x.stroke()})}

function moon(x,cx,cy,r){

function paintVines(x,W,H,k,id){

/* ---------- shared storage (Supabase Storage REST) ---------- */
var BASE=SUPABASE_URL.replace(/\/+$/,'')+'/storage/v1';
var MEDIA_RE=/\.(jpe?g|png|webp|gif|mp4|webm|mov)$/i, VIDEO_RE=/\.(mp4|webm|mov)$/i;
function hdrs(extra){var h={apikey:SUPABASE_KEY};if(/^eyJ/.test(SUPABASE_KEY))h.Authorization='Bearer '+SUPABASE_KEY;for(var k in extra)h[k]=extra[k];return h}
function enc(path){return path.split('/').map(encodeURIComponent).join('/')}
function pub(path,v){return BASE+'/object/public/'+BUCKET+'/'+enc(path)+(v?'?v='+encodeURIComponent(v):'')}
function list(folder){
  return fetch(BASE+'/object/list/'+BUCKET,{method:'POST',headers:hdrs({'Content-Type':'application/json'}),
    body:JSON.stringify({prefix:folder||'',limit:1000,offset:0,sortBy:{column:'name',order:'asc'}})})
  .then(function(r){if(!r.ok)throw new Error('list '+r.status);return r.json()});
}
function put(path,blob,upsert){
  return fetch(BASE+'/object/'+BUCKET+'/'+enc(path),{method:'POST',headers:hdrs({'Content-Type':blob.type||'application/octet-stream','x-upsert':upsert?'true':'false','cache-control':'3600'}),body:blob})
  .then(function(r){if(!r.ok)return r.text().then(function(t){var e=new Error('upload '+r.status);e.body=t;throw e});return path});
}
function del(paths){
  return fetch(BASE+'/object/'+BUCKET,{method:'DELETE',headers:hdrs({'Content-Type':'application/json'}),body:JSON.stringify({prefixes:paths})})
  .then(function(r){if(!r.ok)throw new Error('delete '+r.status)});
}
function whyFailed(e,lead){var t=(e&&e.body)||'';
  if(/mime|content.?type/i.test(t))return lead+' Storage doesn’t accept album settings yet. Run SUPABASE-UPDATE-2.sql in Supabase.';
  if(/row-level|policy|Unauthorized|403/i.test(t))return lead+' Storage isn’t allowing changes yet. Run SUPABASE-UPDATE-2.sql in Supabase.';
  if(t)return lead+' Storage said: '+t.replace(/\s+/g,' ').slice(0,140);
  return lead+' Check your connection and try again.'}
function getMeta(prefix){
  return fetch(pub(prefix+'_meta.json',Date.now()),{cache:'no-store'}).then(function(r){return r.ok?r.json():null}).catch(function(){return null});
}
function saveMeta(prefix,m){return put(prefix+'_meta.json',new Blob([JSON.stringify(m)],{type:'application/json'}),true)}

/* a collection is a folder: '' for the original album, 'c-xxxx/' for the rest */
var MAIN_META={title:'Let It Grow',sub:'Halloween 2026',theme:'grove'};
function prefixOf(id){return id==='main'?'':id+'/'}
function parseRows(prefix,rows){

/* ---------- album ---------- */

  if(!same){page=0;extraPages=0;lastSig='';$('themePanel').hidden=true;$('themeBtn').setAttribute('aria-expanded','false');$('pageBody').innerHTML='<div class="loading">Opening the album…</div>'}

function sig(c){return c.media.map(function(m){return m.path}).join('|')+'#'+c.cover+'#'+c.title+'#'+c.sub+'#'+c.theme}

    b.innerHTML='<img alt="" src="'+themePreview(id)+'"><span>'+esc(T(id).name)+'</span>';
    b.addEventListener('click',function(){chooseTheme(id)});p.appendChild(b)});
  applyTheme()}
function chooseTheme(id){if(!cur||cur.theme===id)return;var c=cur,prev=c.theme;c.theme=id;
  c.meta=Object.assign({},c.meta||{},{title:c.title,sub:c.sub,theme:id,created:(c.meta&&c.meta.created)||Date.now()});lastSig=sig(c);applyTheme();render();
  saveMeta(c.prefix,c.meta).then(function(){toast(T(id).name+' theme saved for everyone')},function(e){if(cur===c){c.theme=prev;c.meta.theme=prev;lastSig=sig(c);applyTheme();render()}toast(whyFailed(e,'Couldn’t save the theme.'),8000)})}

function titleBlock(small){

  shrinkImage(f,2400,true).then(function(b){if(!b)throw 0;return put(c.prefix+'_cover.jpg',b,true)})
  .then(function(){busy--;toast('Cover photo set');return refresh()},function(e){busy--;toast(e&&e.body&&/policy|row-level/i.test(e.body)?'Storage needs its update before covers can be changed.':'Couldn’t set the cover. Try again.',5000)});

  files=[].slice.call(files||[]);if(!files.length||!cur)return;

  files.forEach(function(f,i){chain=chain.then(function(){

    return prepare(f,function(p){toast('Shrinking video'+label+'… '+Math.round(p*100)+'%. Keep this tab open.',600000)})
      .then(function(r){toast('Uploading'+label+'…',600000);return put(c.prefix+stamp()+'.'+r.ext,r.blob,false)})
      .then(function(){ok++},function(e){fails.push(typeof e==='string'?e:(e&&e.body&&/mime|type/i.test(e.body)?'“'+f.name+'” is a file type the storage doesn’t accept yet.':e&&e.body&&/size|large/i.test(e.body)?'“'+f.name+'” is too big to upload.':'“'+f.name+'” didn’t upload.'))});

['dragleave','drop'].forEach(function(t){board.addEventListener(t,function(e){e.preventDefault();board.classList.remove('drag')})});
board.addEventListener('drop',function(e){if(e.dataTransfer&&e.dataTransfer.files)addFiles(e.dataTransfer.files)});
document.addEventListener('paste',function(e){if(!cur||(document.activeElement&&document.activeElement.isContentEditable))return;var f=[].slice.call((e.clipboardData||{}).files||[]);if(f.length)addFiles(f)});

/* ---------- lightbox ---------- */
var lb=$('lb'),lbCur=null;
function openLB(m){lbCur=m;var im=$('lbImg'),vd=$('lbVid');
  if(m.video){im.hidden=true;vd.hidden=false;vd.src=m.src;vd.play().catch(function(){})}else{vd.pause();vd.removeAttribute('src');vd.hidden=true;im.hidden=false;im.src=m.src}
  $('lbPrev').hidden=$('lbNext').hidden=!!m.cover;lb.hidden=false;$('lbClose').focus()}
function closeLB(){lb.hidden=true;var vd=$('lbVid');vd.pause();vd.removeAttribute('src');vd.load()}
function stepLB(d){var f=cur?cur.media:[],i=f.indexOf(lbCur);if(!f.length||i<0)return;openLB(f[(i+d+f.length)%f.length])}
$('lbClose').addEventListener('click',closeLB);
$('lbPrev').addEventListener('click',function(){stepLB(-1)});
$('lbNext').addEventListener('click',function(){stepLB(1)});
lb.addEventListener('click',function(e){if(e.target===lb)closeLB()});
document.addEventListener('keydown',function(e){
  if(!lb.hidden){if(e.key==='Escape')closeLB();if(e.key==='ArrowRight')stepLB(1);if(e.key==='ArrowLeft')stepLB(-1);return}
  if(cur&&e.target===document.body){if(e.key==='ArrowRight')go(1);if(e.key==='ArrowLeft')go(-1)}
});

/* ---------- download the page as a photo ---------- */
function loadImg(src){return new Promise(function(res){var i=new Image();i.crossOrigin='anonymous';i.onload=function(){res(i)};i.onerror=function(){res(null)};i.src=src})}
function loadFrame(src){return new Promise(function(res){var v=document.createElement('video'),t=setTimeout(function(){res(null)},8000);
  v.crossOrigin='anonymous';v.muted=true;v.preload='auto';v.playsInline=true;
  v.onloadeddata=function(){v.currentTime=Math.min(.5,(v.duration||1)/2)};
  v.onseeked=function(){clearTimeout(t);res(v)};v.onerror=function(){clearTimeout(t);res(null)};v.src=src})}
function coverDraw(x,img,dx,dy,dw,dh){var iw=img.videoWidth||img.naturalWidth||img.width,ih=img.videoHeight||img.naturalHeight||img.height;if(!iw||!ih)return;
  var s=Math.max(dw/iw,dh/ih),sw=dw/s,sh=dh/s;try{x.drawImage(img,(iw-sw)/2,(ih-sh)/2,sw,sh,dx,dy,dw,dh)}catch(e){}}
var expT=THEMES.grove;
function tapeDraw(x,k,cx,cy,tw,ang){var th=28*k;x.save();x.translate(cx,cy);x.rotate(ang);x.beginPath();
  [[0,.04],[.04,0],[.08,.06],[.12,0],[.88,0],[.92,.06],[.96,0],[1,.05],[1,.95],[.96,1],[.92,.94],[.88,1],[.12,1],[.08,.94],[.04,1],[0,.96],[.03,.5]]
  .forEach(function(p,j){var px=-tw/2+p[0]*tw,py=-th/2+p[1]*th;j?x.lineTo(px,py):x.moveTo(px,py)});x.closePath();
  x.shadowColor='rgba(40,20,5,.25)';x.shadowBlur=2*k;x.shadowOffsetY=1*k;x.fillStyle=expT.tape;x.fill();x.shadowColor='transparent';
  var g=x.createLinearGradient(0,-th/2,0,th/2);g.addColorStop(0,'rgba(255,255,255,.22)');g.addColorStop(.4,'rgba(255,255,255,0)');g.addColorStop(1,'rgba(0,0,0,.05)');x.fillStyle=g;x.fill();x.restore()}
function print(x,k,cx,cy,pw,phh,ins,ang,img,tapesFn){
  var w=pw+2*ins,h=phh+2*ins;x.save();x.translate(cx,cy);x.rotate(ang);
  x.shadowColor='rgba(25,10,0,.5)';x.shadowBlur=18*k;x.shadowOffsetY=8*k;x.fillStyle=expT.paper;x.fillRect(-w/2,-h/2,w,h);x.shadowColor='transparent';
  x.fillStyle='#d8cdb8';x.fillRect(-w/2+ins,-h/2+ins,pw,phh);if(img)coverDraw(x,img,-w/2+ins,-h/2+ins,pw,phh);
  tapesFn(w,h);x.restore()}
function exportPage(){
  if(!cur)return Promise.resolve(null);
  var isCover=page===0,start=(page-1)*PER,items=isCover?[]:frames().slice(start,start+PER).filter(Boolean);
  if(isCover&&!cur.cover){toast('Add a cover photo first');return Promise.resolve(null)}
  if(!isCover&&!items.length){toast('Add some photos to this page first');return Promise.resolve(null)}
  var fontsReady=(document.fonts&&document.fonts.ready)?document.fonts.ready:Promise.resolve();
  var loads=isCover?[loadImg(cur.cover)]:items.map(function(m){return m.video?loadFrame(m.src):loadImg(m.src)});
  return Promise.all([fontsReady].concat(loads)).then(function(r){
    var imgs=r.slice(1),k=2,W=1040*k,cols=2,rows=Math.ceil(items.length/cols),padX=90*k,gap=50*k,ins=9*k;
    var top=isCover?280*k:200*k,slot=(W-2*padX-(cols-1)*gap)/cols,pw=slot-2*ins,phh=pw*9/16,fh=phh+2*ins;
    var hpw=W-2*padX-60*k,hph=hpw*9/16;
    var H=isCover?top+hph+24*k+150*k:top+rows*fh+(rows-1)*gap+150*k;
    var c=document.createElement('canvas');c.width=W;c.height=H;var x=c.getContext('2d');expT=T(cur.theme);
    x.fillStyle='rgb('+expT.board.join(',')+')';x.fillRect(0,0,W,H);
    try{var bw=woodFor(cur.theme,'board').canvas;x.save();x.scale(k*1.2,k*1.2);x.fillStyle=x.createPattern(bw,'repeat');x.fillRect(0,0,W/(k*1.2),H/(k*1.2));x.restore()}catch(e){}
    var vg=x.createRadialGradient(W/2,H/2,Math.min(W,H)*.35,W/2,H/2,Math.max(W,H)*.75);vg.addColorStop(0,'rgba(30,15,5,0)');vg.addColorStop(1,'rgba(30,15,5,.45)');x.fillStyle=vg;x.fillRect(0,0,W,H);
    x.lineWidth=12*k;x.strokeStyle=expT.edge;x.strokeRect(6*k,6*k,W-12*k,H-12*k);
    x.lineWidth=2*k;x.strokeStyle='rgba(0,0,0,.4)';x.strokeRect(18*k,18*k,W-36*k,H-36*k);
    x.strokeStyle='rgba(255,220,170,.18)';x.strokeRect(19.5*k,19.5*k,W-39*k,H-39*k);
    x.textAlign='center';x.textBaseline='alphabetic';
    var ts=isCover?64:34,ty=isCover?140*k:110*k;
    x.font='400 '+(ts*k)+'px "Fredericka the Great", Georgia, serif';
    var title=cur.title;while(x.measureText(title).width>W-2*padX&&title.length>4)title=title.slice(0,-2)+'…';
    x.fillStyle=expT.glow;x.fillText(title,W/2,ty+1.5*k);x.fillStyle=expT.ink;x.fillText(title,W/2,ty);
    if(cur.sub){x.font='600 '+((isCover?17:12)*k)+'px Bitter, Georgia, serif';try{x.letterSpacing=((isCover?5:3.5)*k)+'px'}catch(e){}
      var sy=ty+(isCover?46:30)*k;x.fillStyle=expT.subShadow;x.fillText(cur.sub.toUpperCase(),W/2+2.5*k,sy+1.5*k);x.fillStyle=expT.sub;x.fillText(cur.sub.toUpperCase(),W/2+2.5*k,sy);
      try{x.letterSpacing='0px'}catch(e){}}
    if(isCover){
      print(x,k,W/2,top+hph/2+12*k,hpw,hph,12*k,-.6*Math.PI/180,imgs[0],function(w,h){
        tapeDraw(x,k,-w/2+w*.02,-h/2+4*k,Math.min(w*.22,120*k),-38*Math.PI/180);tapeDraw(x,k,w/2-w*.02,-h/2+4*k,Math.min(w*.22,120*k),36*Math.PI/180)});
    }else{
      items.forEach(function(m,i){
        var gi=start+i,row=Math.floor(i/cols),col=i%cols,inRow=Math.min(cols,items.length-row*cols);
        var left=(W-(inRow*slot+(inRow-1)*gap))/2,cx=left+col*(slot+gap)+slot/2,cy=top+row*(fh+gap)+fh/2;
        print(x,k,cx,cy,pw,phh,ins,parseFloat(tilts[gi%tilts.length])*Math.PI/180,imgs[i],function(w,h){
          tapeDraw(x,k,0,-h/2+1*k,Math.min(w*.34,130*k),parseFloat(tapes[gi%tapes.length])*Math.PI/180)});
      });
      x.font='700 '+(22*k)+'px Caveat, "Segoe Print", cursive';x.fillStyle=expT.folio;x.textAlign='center';x.fillText('page '+page,W/2,H-60*k);
    }
    paintVines(x,W,H,k,cur.theme);
    return new Promise(function(res){try{c.toBlob(function(b){res(b)},'image/png')}catch(e){res(null)}});
  });
}
var dlBtn=$('dlBtn'),dlReady=(window.claude&&window.claude.use)?window.claude.use('downloads').catch(function(){return null}):Promise.resolve(null);
dlBtn.addEventListener('click',function(){
  dlBtn.disabled=true;var old=dlBtn.textContent;dlBtn.textContent='Making your photo…';
  Promise.all([exportPage(),dlReady]).then(function(r){var blob=r[0],api=r[1];if(!blob)return;
    var slug=(cur.title||'album').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')||'album';
    var name=slug+'-'+(page===0?'cover':'page-'+page)+'.png';
    if(api)return api.save({filename:name,data:blob}).then(function(){toast('Saved '+name)},function(e){if(e&&e.code!=='declined')toast('That download didn’t go through. Try again.')});
    var a=document.createElement('a'),u=URL.createObjectURL(blob);a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();
    setTimeout(function(){URL.revokeObjectURL(u)},4000);toast('Saved '+name);
  }).then(function(){dlBtn.disabled=false;dlBtn.textContent=old},function(){dlBtn.disabled=false;dlBtn.textContent=old;toast('Couldn’t make the photo. Try again.')});
});

/* ---------- boot ---------- */
var rt;window.addEventListener('resize',function(){clearTimeout(rt);rt=setTimeout(function(){if(cur)drawVines()},120)});
if(window.ResizeObserver)new ResizeObserver(function(){clearTimeout(rt);rt=setTimeout(function(){if(cur)drawVines()},60)}).observe(board);
setInterval(function(){if(cur&&!busy&&!document.hidden&&lb.hidden)refresh()},45000);
document.addEventListener('visibilitychange',function(){if(!document.hidden&&cur&&!busy)refresh()});
route();
})();
</script>
